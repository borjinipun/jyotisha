name: release

# Build standalone release binaries for Linux/macOS/Windows and attach
# them to a GitHub Release when a version tag (v*) is pushed.
# Manual runs (workflow_dispatch) only build and upload workflow artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            pkg: jyotisha-${{ github.ref_name }}-linux-x86_64
            ext: .tar.gz
            prep: sudo apt-get update -y && sudo apt-get install -y musl-tools
          - target: aarch64-apple-darwin
            os: macos-latest # Apple Silicon runner
            pkg: jyotisha-${{ github.ref_name }}-macos-apple-silicon
            ext: .tar.gz
          - target: x86_64-apple-darwin
            os: macos-13 # Intel runner
            pkg: jyotisha-${{ github.ref_name }}-macos-intel
            ext: .tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            pkg: jyotisha-${{ github.ref_name }}-windows-x86_64
            ext: .zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        if: matrix.prep != ''
        run: ${{ matrix.prep }}

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == '.tar.gz'
        run: |
          BRN="jyotisha-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${BRN}"
          cp "target/${{ matrix.target }}/release/jyotisha-server" "dist/${BRN}/"
          cp README.md LICENSE "dist/${BRN}/"
          tar czf "${{ matrix.pkg }}${{ matrix.ext }}" -C dist "${BRN}"
          ls -la "${{ matrix.pkg }}${{ matrix.ext }}"
        shell: bash

      - name: Package (zip)
        if: matrix.ext == '.zip'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $dir = "jyotisha-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jyotisha-server.exe" "dist/$dir/"
          Copy-Item README.md, LICENSE "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "${{ matrix.pkg }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          retention-days: 1
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Create GitHub Release
        run:
          gh release create "${{ github.ref_name }}" dist/* --title "Jyotisha
          ${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
